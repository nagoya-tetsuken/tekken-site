media:
  - name: images
    label: 画像
    input: media/images
    output: /media/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

content:
  - name: home
    label: トップページ
    type: file
    path: index.md
    fields:
      - name: title
        label: ページ名
        type: string
      - name: sections
        label: セクション
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "セクション {index}"
        fields:
          - name: title
            label: 見出し
            type: string
          - name: text
            label: 本文
            type: text
          - name: title_en
            label: 英語見出し
            type: string
          - name: text_en
            label: 英語本文
            type: text
          - name: image
            label: 画像
            type: image
            options: { media: images, extensions: [jpg, jpeg, png, webp] }

  - name: notify
    label: お知らせページ
    type: file
    path: notify.md
    fields:
      - name: title
        label: ページタイトル
        type: string
        required: true
      - name: twitter_username
        label: X（旧Twitter）のユーザー名
        type: string
        required: true

  - name: activities
    label: 活動記事
    type: collection
    path: _activities
    filename: "{year}-{month}-{day}-{title}.md"
    operations: { rename: false }
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 日付
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: excerpt
        label: 概要
        type: text
        required: true
      - name: cover
        label: アイキャッチ画像
        type: image
        options: { media: images, extensions: [jpg, jpeg, png, webp] }
      - name: body
        label: 本文
        type: rich-text
        options: { media: images, format: markdown }
    view:
      fields: [title, published, date]
      primary: title
      sort: [date]
      default: { sort: date, order: desc }

  - name: media
    label: 作品記事
    type: collection
    path: _media
    filename: "{year}-{month}-{day}-{title}.md"
    operations: { rename: false }
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 日付
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: excerpt
        label: 概要
        type: text
        required: true
      - name: cover
        label: アイキャッチ画像
        type: image
        options: { media: images, extensions: [jpg, jpeg, png, webp] }
      - name: body
        label: 本文
        type: rich-text
        options: { media: images, format: markdown }
    view:
      fields: [title, published, date]
      primary: title
      sort: [date]
      default: { sort: date, order: desc }

settings:
  hide: true
  content: { merge: true }
  commit:
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"
